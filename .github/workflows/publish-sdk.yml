name: Publish SDK

on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable

      - name: Typecheck SDK
        run: node scripts/tsc7.mjs --noEmit -p packages/sdk/tsconfig.json
      - name: Typecheck React
        run: node scripts/tsc7.mjs --noEmit -p packages/react/tsconfig.json

      - name: Test SDK
        run: cd packages/sdk && npx vitest run
      - name: Test React
        run: cd packages/react && npx vitest run
      - name: Test Utils
        run: cd packages/utils && npx vitest run
      - name: Test UI
        run: cd packages/ui && npx vitest run

  publish-sdk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install --immutable

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Set SDK version
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: cd packages/sdk && npm version "$PKG_VERSION" --no-git-tag-version

      - name: Set React version
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: cd packages/react && npm version "$PKG_VERSION" --no-git-tag-version

      - name: Build SDK
        run: cd packages/sdk && yarn build
      # The build keeps import paths as written, and Node refuses a relative import with no extension:
      # 1.0.0 shipped `from './client'` and failed to load outside a bundler. Load the built files the way
      # plain Node does before publishing them.
      - name: Load the built SDK in plain Node
        run: cd packages/sdk && node --input-type=module -e "await import('./dist/index.js'); await import('./dist/sprite-layout.js')"
      # Trusted publishing: npm checks this run's GitHub identity token against the trusted publisher set on
      # the package (repository gibsfinance/assets, workflow publish-sdk.yml). No npm token is stored anywhere,
      # and npm adds provenance on its own. Needs npm 11.5.1 or later, which Node 24 ships.
      - name: Publish @gibs/sdk
        run: cd packages/sdk && npm publish --access public

  publish-react:
    needs: publish-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      - run: yarn install --immutable

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Set React version
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: cd packages/react && npm version "$PKG_VERSION" --no-git-tag-version

      - name: Update SDK dependency to published version
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: cd packages/react && npm pkg set "dependencies.@gibs/sdk=$PKG_VERSION"

      - name: Build React package
        run: cd packages/react && yarn build
      - name: Load the built React package in plain Node
        run: cd packages/react && node --input-type=module -e "await import('./dist/index.js')"
      - name: Publish @gibs/react
        run: cd packages/react && npm publish --access public
