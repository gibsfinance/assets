# gib.show on the altar-prod `gib` tenant: production and staging side by side.
#
# Runs under rootless Docker as the `gib` user. Every byte of state lives in named
# volumes, which rootless Docker keeps under its data root, /srv/gib/docker.
#
# Secrets: none in this file. `deploy.sh` writes ~/app/.env from gib.env.tpl with
# `op inject`. Compose reads that file twice: `env_file` hands the shared keys to the
# app containers, and `${...}` interpolation builds the per-environment values below.
# Never run `docker compose config` without `--no-interpolate`; it prints them.
#
# Memory budget (the tenant's whole slice is capped at 20 GiB, no swap). The limits
# add up to 18 GiB, so one runaway container is killed at its own limit before the
# slice is exhausted, and image builds keep about 2 GiB of room:
#   postgres 2 x 3 GiB, browser 2 x 1.5 GiB, server 2 x 1.5 GiB, collector 2 x 3 GiB.
# CPU (the slice gets 6 threads) is compressible, so these limits only stop one
# container from starving the rest.
#
# Only the two servers publish ports, and only on 127.0.0.1. Public ingress is not
# configured here; see docs/deploy-altar.md.

name: gib

x-postgres: &postgres
  build:
    context: ${GIB_SOURCE_PRODUCTION:-/srv/gib/src/production}
    dockerfile: Dockerfile.postgres
  image: gib/postgres:16
  restart: unless-stopped
  shm_size: 1g
  mem_limit: 3g
  cpus: 2
  # Sized for 3 GiB: work_mem x connections must stay well inside the limit.
  command:
    - postgres
    - -c
    - shared_buffers=1GB
    - -c
    - effective_cache_size=2GB
    - -c
    - work_mem=32MB
    - -c
    - maintenance_work_mem=256MB
    - -c
    - max_connections=60
    - -c
    - max_wal_size=1GB
    - -c
    - temp_buffers=32MB
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U gibassets -d gibassets']
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s

x-browser: &browser
  # Pinned by digest in deploy.sh's pull step; the tag documents the line.
  image: ghcr.io/browserless/chromium:latest
  restart: unless-stopped
  mem_limit: 1536m
  cpus: 1
  shm_size: 512m
  healthcheck:
    test: ['CMD-SHELL', 'curl -fsS "http://127.0.0.1:3000/active?token=$${TOKEN}" >/dev/null']
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

x-server: &server
  image: gib/server:${GIB_ENVIRONMENT:-production}
  restart: unless-stopped
  mem_limit: 1536m
  cpus: 1.5
  env_file: .env
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 60s

x-collector: &collector
  restart: unless-stopped
  mem_limit: 3g
  cpus: 1.5
  env_file: .env
  # `yarn run collect` makes one pass and exits. The loop repeats it after a pause, and
  # COLLECT_FIRST_DELAY staggers the two environments so their heavy passes rarely
  # overlap. A failed pass is logged and the loop carries on, as Railway's cron did.
  command:
    - sh
    - -c
    - |
      sleep "$${COLLECT_FIRST_DELAY:-0}"
      while true; do
        echo "collect: pass started $$(date -u +%FT%TZ)"
        yarn run collect || echo "collect: pass failed with $$?"
        echo "collect: pass ended $$(date -u +%FT%TZ); next in $${COLLECT_INTERVAL_SECONDS}s"
        sleep "$${COLLECT_INTERVAL_SECONDS}"
      done
  healthcheck:
    # Healthy while the loop is alive; a pass in progress or a pause both count.
    test: ['CMD-SHELL', 'pgrep -f "while true" >/dev/null || pgrep -f collect >/dev/null']
    interval: 60s
    timeout: 10s
    retries: 3

services:
  # ── production ────────────────────────────────────────────────────────────────
  postgres-production:
    <<: *postgres
    environment:
      POSTGRES_DB: gibassets
      POSTGRES_USER: gibassets
      POSTGRES_PASSWORD: ${PRODUCTION_POSTGRES_PASSWORD:?run deploy.sh to write .env}
    volumes:
      - postgres-production:/var/lib/postgresql/data
    networks: [production]

  browser-production:
    <<: *browser
    environment:
      TOKEN: ${PRODUCTION_BROWSER_TOKEN:?run deploy.sh to write .env}
      CONCURRENT: '2'
      QUEUED: '10'
      TIMEOUT: '300000'
    volumes:
      - browser-production:/tmp
    networks: [production]

  server-production:
    <<: *server
    build:
      context: ${GIB_SOURCE_PRODUCTION:-/srv/gib/src/production}
      dockerfile: Dockerfile
      args:
        ROOT_URI: https://gib.show
        PUBLIC_BASE_URL: https://gib.show
    image: gib/server:production
    environment:
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=1024
      DATABASE_URL: postgres://gibassets:${PRODUCTION_POSTGRES_PASSWORD}@postgres-production:5432/gibassets
      PGDATABASE: gibassets
      ROOT_URI: https://gib.show
      PUBLIC_BASE_URL: https://gib.show
      CACHE_SECONDS: '86400'
      DEBUG: '📷'
    ports:
      - 127.0.0.1:3100:3000
    depends_on:
      postgres-production:
        condition: service_healthy
    networks: [production]

  collector-production:
    <<: *collector
    build:
      context: ${GIB_SOURCE_PRODUCTION:-/srv/gib/src/production}
      dockerfile: Dockerfile.worker
    image: gib/collector:production
    environment:
      NODE_OPTIONS: --max-old-space-size=2560
      DATABASE_URL: postgres://gibassets:${PRODUCTION_POSTGRES_PASSWORD}@postgres-production:5432/gibassets
      PGDATABASE: gibassets
      BROWSER_WS_ENDPOINT: ws://browser-production:3000?token=${PRODUCTION_BROWSER_TOKEN}
      RPC_56: ${PRODUCTION_RPC_56}
      DEBUG: '📷'
      FAKE_SPINNER: 'true'
      PREVENT_WRITE_MISSING: 'true'
      COLLECT_FIRST_DELAY: '0'
      COLLECT_INTERVAL_SECONDS: '3600'
    depends_on:
      postgres-production:
        condition: service_healthy
      browser-production:
        condition: service_healthy
    networks: [production]

  # ── staging ───────────────────────────────────────────────────────────────────
  postgres-staging:
    <<: *postgres
    environment:
      POSTGRES_DB: gibassets
      POSTGRES_USER: gibassets
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?run deploy.sh to write .env}
    volumes:
      - postgres-staging:/var/lib/postgresql/data
    networks: [staging]

  browser-staging:
    <<: *browser
    environment:
      TOKEN: ${STAGING_BROWSER_TOKEN:?run deploy.sh to write .env}
      CONCURRENT: '2'
      QUEUED: '10'
      TIMEOUT: '300000'
    volumes:
      - browser-staging:/tmp
    networks: [staging]

  server-staging:
    <<: *server
    build:
      context: ${GIB_SOURCE_STAGING:-/srv/gib/src/staging}
      dockerfile: Dockerfile
      args:
        ROOT_URI: https://staging.gib.show
        PUBLIC_BASE_URL: https://staging.gib.show
    image: gib/server:staging
    environment:
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=1024
      DATABASE_URL: postgres://gibassets:${STAGING_POSTGRES_PASSWORD}@postgres-staging:5432/gibassets
      PGDATABASE: gibassets
      ROOT_URI: https://staging.gib.show
      PUBLIC_BASE_URL: https://staging.gib.show
      CACHE_SECONDS: '86400'
      DEBUG: '📷*'
      # A public OAuth client identifier, not a secret: the browser bundle carries it.
      GITLAB_OAUTH_CLIENT_ID: 3286f305dd6fbb92a7aed87918bd65baff83a6c7842f46eceb9ac0ca326a8393
      GITLAB_OAUTH_CLIENT_SECRET: ${STAGING_GITLAB_OAUTH_CLIENT_SECRET}
    ports:
      - 127.0.0.1:3101:3000
    depends_on:
      postgres-staging:
        condition: service_healthy
    networks: [staging]

  collector-staging:
    <<: *collector
    build:
      context: ${GIB_SOURCE_STAGING:-/srv/gib/src/staging}
      dockerfile: Dockerfile.worker
    image: gib/collector:staging
    environment:
      NODE_OPTIONS: --max-old-space-size=2560
      DATABASE_URL: postgres://gibassets:${STAGING_POSTGRES_PASSWORD}@postgres-staging:5432/gibassets
      PGDATABASE: gibassets
      BROWSER_WS_ENDPOINT: ws://browser-staging:3000?token=${STAGING_BROWSER_TOKEN}
      RPC_56: ${STAGING_RPC_56}
      DEBUG: '📷*'
      FAKE_SPINNER: 'true'
      PREVENT_WRITE_MISSING: 'true'
      # Half an interval behind production, so the two heavy passes do not overlap.
      COLLECT_FIRST_DELAY: '1800'
      COLLECT_INTERVAL_SECONDS: '3600'
    depends_on:
      postgres-staging:
        condition: service_healthy
      browser-staging:
        condition: service_healthy
    networks: [staging]

volumes:
  postgres-production:
  postgres-staging:
  browser-production:
  browser-staging:

networks:
  # The environments cannot reach each other's database or browser.
  production:
  staging:
